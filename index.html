<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Кликер</h1>
            <div class="stats">
                <div class="stat-item">
                    <span>💰 Счёт:</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-item">
                    <span>⚡ Кликов в секунду:</span>
                    <span id="clickPower">10</span>
                </div>
            </div>
        </div>

        <div class="game-area">
            <button id="clickButton" class="click-button">
                🎯
            </button>
            <div id="clickEffect" class="click-effect"></div>
        </div>

        <div class="shop">
            <h2>Магазин</h2>
            <div class="shop-grid">
                <div class="shop-item" data-id="1">
                    <h3>⚡ Улучшение клика</h3>
                    <p>+1 к силе клика</p>
                    <p class="price">💰 10</p>
                    <button class="buy-btn" data-price="10" data-type="click">Купить</button>
                </div>
                <div class="shop-item" data-id="2">
                    <h3>🤖 Автокликер</h3>
                    <p>+1 клик в секунду</p>
                    <p class="price">💰 50</p>
                    <button class="buy-btn" data-price="50" data-type="auto">Купить</button>
                </div>
                <div class="shop-item" data-id="3">
                    <h3>💎 Множитель x2</h3>
                    <p>Удваивает все клики</p>
                    <p class="price">💰 100</p>
                    <button class="buy-btn" data-price="100" data-type="multiplier">Купить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
